org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m

android.useAndroidX=true
android.enableJetifier=true

reactNativeArchitectures=armeabi-v7a,arm64-v8a,x86,x86_64

org.gradle.caching=true
org.gradle.parallel=false
# Disable classpath instrumentation to avoid Java 21 bytecode issues
org.gradle.configuration-cache=false
org.gradle.unsafe.configuration-cache=false

hermesEnabled=true

# Kotlin + Java 17
kotlin.compiler.jvmTarget=17
kotlin.version=1.8.20

# Google Sign-In package requirements
RNGS_compileSdkVersion=34
RNGS_minSdkVersion=24
RNGS_targetSdkVersion=34
RNGS_kotlinVersion=1.8.20