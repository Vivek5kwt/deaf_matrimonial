apply plugin: "com.android.application"
apply plugin: "kotlin-android"

project.ext.react = [
    enableHermes: true
]

apply from: "../../node_modules/react-native/react.gradle"

android {
    namespace "com.deafmatrimonial"
    compileSdkVersion 34

    defaultConfig {
        applicationId "com.deafmatrimonial"
        minSdkVersion 24
        targetSdkVersion 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:1.8.10"
}
